<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CFA Level I Study App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#e3e6ea;--acc:#1f4e8c;--acc2:#e8eef7;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeaea;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e8ebef;--mute:#98a1ad;--line:#2a3038;--acc:#7aa7e6;--acc2:#1d2633;--ok:#5cc98a;--okbg:#16281e;--bad:#f08a82;--badbg:#2e1a19}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){nav button.on,.btn.pri{color:#0f1216}}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:22px;margin:4px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.topic{cursor:pointer;transition:border-color .15s}
.topic:hover{border-color:var(--acc)}
.topic h3{margin:0 0 2px;font-size:16px}
.w{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc)}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.flash{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer;padding:30px;white-space:pre-line}
.flash.back{background:var(--acc2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sp{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:10px;padding:12px 14px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:6px;white-space:pre-line}
.q{font-size:16px;font-weight:500;white-space:pre-line}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);margin-bottom:8px}
.mono{font-family:"JetBrains Mono",monospace;font-size:13.5px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.mod{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.mod:last-child{border:0}
.mod input{margin-top:4px}
.big{font-size:34px;font-weight:700}
.pill{font-size:12px;color:var(--mute)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}

details summary{list-style:revert}
@media (max-width:600px){main{padding:16px 12px 60px}header{padding:10px 12px}.flash{font-size:16px;padding:20px;min-height:200px}nav button{padding:6px 10px;font-size:13px}}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')">CFA Level I</h1>
  <nav id="nav">
    <button data-v="home">Topics</button>
    <button data-v="mock">Mock exam</button>
    <button data-v="formulas">Formulas</button>
    <button data-v="glossary">Glossary</button>
    <button data-v="review">Mistakes</button>
  </nav>
</header>
<main id="app"><p class="sub">Loading…</p></main>
<script>window.CFA_PUBLIC = true;
const F = [
["Quant","EAR (discrete)","EAR = (1 + r/m)^m − 1"],
["Quant","EAR (continuous)","EAR = e^r − 1"],
["Quant","Holding period return","HPR = (P1 − P0 + D1)/P0"],
["Quant","Geometric mean","[(1+R1)(1+R2)…(1+Rn)]^(1/n) − 1"],
["Quant","Coefficient of variation","CV = s / X̄"],
["Quant","Sharpe ratio","(Rp − Rf) / σp"],
["Quant","Roy's safety-first","[E(Rp) − RL] / σp"],
["Quant","Bayes' formula","P(A|B) = P(B|A)·P(A) / P(B)"],
["Quant","Standard error of mean","σx̄ = σ/√n"],
["Quant","t-stat","t = (x̄ − μ0)/(s/√n)"],
["Quant","Regression slope","b1 = Cov(X,Y)/Var(X); b0 = Ȳ − b1X̄"],
["Quant","R² and F","R² = SSR/SST; F = MSR/MSE"],
["Quant","Chebyshev","Proportion within k s.d. ≥ 1 − 1/k²"],
["Econ","HHI","Σ (market share %)²"],
["Econ","Forward FX rate","F = S × (1 + i_price)/(1 + i_base)"],
["Econ","Forward points","F − S (often ×10,000)"],
["FSA","Basic EPS","(NI − pref div)/weighted avg shares"],
["FSA","FCFF","CFO + Int(1 − t) − FCInv"],
["FSA","FCFE","CFO − FCInv + net borrowing"],
["FSA","3-step DuPont","ROE = NI/Sales × Sales/TA × TA/Equity"],
["FSA","Cash conversion cycle","DOH + DSO − DPO"],
["FSA","Current / quick ratio","CA/CL; (Cash + ST inv + Receivables)/CL"],
["FSA","Interest coverage","EBIT / interest expense"],
["CI","WACC","wd·rd(1 − t) + wp·rp + we·re"],
["CI","MM II (no tax)","re = r0 + (r0 − rd)(D/E)"],
["CI","MM I (tax)","VL = VU + tD"],
["Equity","Leverage ratio","1 / initial margin"],
["Equity","Margin call price","P0(1 − IM)/(1 − MM)"],
["Equity","Gordon growth","V0 = D1/(r − g)"],
["Equity","Preferred stock","V0 = D/r"],
["Equity","Justified forward P/E","(D1/E1)/(r − g)"],
["Equity","Enterprise value","Equity MV + debt + preferred − cash"],
["FI","Bond price","Σ C/(1+r)^t + FV/(1+r)^N"],
["FI","Current yield","Annual coupon / price"],
["FI","Modified duration","MacDur/(1 + r)"],
["FI","Price change","%ΔP ≈ −ModDur·Δy + ½·Conv·(Δy)²"],
["FI","Money duration / PVBP","MoneyDur = ModDur × PV; PVBP = (PV₋ − PV₊)/2"],
["FI","Effective duration","(PV₋ − PV₊)/(2·ΔCurve·PV₀)"],
["FI","Forward from spot","(1+z_B)^B = (1+z_A)^A (1+f)^(B−A)"],
["FI","Expected loss","POD × LGD"],
["Derivatives","Forward price","F0 = S0(1 + r)^T (adj. for carry)"],
["Derivatives","Forward value (long)","Vt = St − F0/(1 + r)^(T−t)"],
["Derivatives","Put–call parity","S0 + P0 = C0 + X/(1 + r)^T"],
["Derivatives","Put–call forward parity","F0/(1+r)^T + P0 = C0 + X/(1+r)^T"],
["Derivatives","Binomial prob.","q = (1 + r − d)/(u − d)"],
["AI","Commodity futures return","Spot return + roll return + collateral return"],
["PM","Utility","U = E(r) − ½Aσ²"],
["PM","Portfolio variance","w1²σ1² + w2²σ2² + 2w1w2ρσ1σ2"],
["PM","Beta","Cov(i,m)/σm² = ρσi/σm"],
["PM","CAPM","E(Ri) = Rf + β[E(Rm) − Rf]"],
["PM","Treynor","(Rp − Rf)/βp"],
["PM","M²","(Rp − Rf)σm/σp − (Rm − Rf)"],
["PM","Jensen's alpha","Rp − [Rf + β(Rm − Rf)]"]
];
/* CFA Level I study app. DATA from content.json; glossary from glossary.json (private build only). */
const PUBLIC = window.CFA_PUBLIC === true;
let D = null, G = [];
const KEY = "cfa1-app-v2";
let S = {cards:{}, quiz:{}, mods:{}, wrong:[], pp:{}};
try { const s = localStorage.getItem(KEY); if (s) S = Object.assign(S, JSON.parse(s)); } catch (e) {}
S.pp = S.pp || {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const W = {eth:17.5,quant:7.5,econ:7.5,fsa:12.5,ci:7.5,eq:12.5,fi:12.5,der:6.5,ai:8.5,pm:10};
const FMAP = {quant:"Quant",econ:"Econ",fsa:"FSA",ci:"CI",eq:"Equity",fi:"FI",der:"Derivatives",ai:"AI",pm:"PM"};

const topic = id => D.topics.find(t => t.id === id);
const mod = (t, n) => t.mods.find(m => m.n === n);
function src(t, n){ const m = mod(t, n); if (!m) return ""; const p = m.p[0] ? ` · pp. ${m.p[0]}${m.p[1] ? "–" + m.p[1] : "+"}` : ""; return `Vol ${t.vol} · LM${n}${p}`; }
const qs = t => (D.Q[t.id] || []).map((q, i) => ({t, q, i, key: t.id + ":" + i}));
const cs = t => (D.C[t.id] || []).map((c, i) => ({t, c, i, key: t.id + ":" + i}));
const gl = (t, n) => G.filter(g => g[2] === t.id && (n == null || g[3] === n));

function stats(t){
  const C = cs(t), Qs = qs(t);
  const known = C.filter(x => (S.cards[x.key] || 0) >= 2).length;
  const right = Qs.filter(x => S.quiz[x.key] && S.quiz[x.key].last).length;
  const mods = t.mods.filter(m => S.mods[t.id + ":" + m.n]).length;
  const pct = Math.round(100 * (known / Math.max(1, C.length) * 0.35 + right / Math.max(1, Qs.length) * 0.45 + mods / t.mods.length * 0.2));
  return {known, right, mods, pct, nc: C.length, nq: Qs.length};
}

/* ---------- routing ---------- */
let view = "home", tab = "mods";
function setNav(){ document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view || (view === "topic" && b.dataset.v === "home"))); }
function go(v, arg){ view = v; setNav(); window.scrollTo(0, 0); document.onkeydown = null; ({home, topicView, mock, formulas, review, glossary})[v](arg); }

function home(){
  const all = D.topics.map(stats);
  const avg = Math.round(all.reduce((a, b) => a + b.pct, 0) / all.length);
  const nq = all.reduce((a, b) => a + b.nq, 0), nc = all.reduce((a, b) => a + b.nc, 0);
  app.innerHTML = `<h2>Topics</h2><p class="sub">2026 CFA Level I curriculum · ${nq} questions · ${nc} concept cards${PUBLIC ? "" : ` · ${G.length} glossary terms`} · overall ${avg}%</p>
  <div class="grid">${D.topics.map((t, i) => { const s = all[i]; return `<div class="card topic" onclick="go('topicView','${t.id}')">
   <h3>${esc(t.name)}</h3><div class="w">Vol ${t.vol} · weight ${t.w} · ${t.mods.length} modules</div>
   <div class="bar"><i style="width:${s.pct}%"></i></div>
   <div class="stat"><span>${s.right}/${s.nq} quiz</span><span>${s.mods}/${t.mods.length} LMs</span><span>${s.pct}%</span></div></div>`; }).join("")}</div>
  <div class="row" style="margin-top:18px"><button class="btn" id="rs">Reset progress</button></div>`;
  $("rs").onclick = () => { const d = document.createElement("div"); d.className = "row"; d.innerHTML = `<span>Clear all progress?</span><button class="btn pri" id="ry">Yes, reset</button><button class="btn" id="rn">Cancel</button>`; app.appendChild(d); $("ry").onclick = () => { S = {cards:{}, quiz:{}, mods:{}, wrong:[], pp:{}}; save(); go("home"); }; $("rn").onclick = () => d.remove(); };
}

function topicView(id){
  const t = topic(id);
  const tabs = [["mods","Modules"],["cards","Flashcards"],["quiz","Quiz"],["form","Formulas"]];
  app.innerHTML = `<h2>${esc(t.name)}</h2><p class="sub">2026 curriculum Volume ${t.vol} · exam weight ${t.w}</p>
  <div class="tabs">${tabs.map(([k, l]) => `<button class="btn ${tab === k ? "pri" : ""}" data-k="${k}">${l}</button>`).join("")}</div><div id="pane"></div>`;
  app.querySelectorAll(".tabs .btn").forEach(b => b.onclick = () => { tab = b.dataset.k; topicView(id); });
  ({mods: paneMods, cards: () => paneCards(t), quiz: () => paneQuiz(t), form: paneForm})[tab](t);
}

function paneMods(t){
  $("pane").innerHTML = `<p class="sub" style="margin:0 0 12px">For each module: ① read the notes, ② flip the flashcards, ③ take the quiz, ④ do the official practice problems in your book and grade them here. Tick the box when done.</p>` + t.mods.map(m => {
    const nq = qs(t).filter(x => x.q[0] === m.n).length, nc = cs(t).filter(x => x.c[0] === m.n).length, ng = PUBLIC ? 0 : gl(t, m.n).length;
    const k = t.id + ":" + m.n;
    return `<div class="card" style="margin-bottom:10px"><div class="row" style="margin:0"><label style="display:flex;gap:8px;align-items:flex-start;flex:1"><input type="checkbox" data-k="${k}" ${S.mods[k] ? "checked" : ""} style="margin-top:5px"><span><b>LM${m.n} · ${esc(m.t)}</b><br><span class="pill">${src(t, m.n)}</span></span></label></div>
    <details style="margin-top:8px"><summary class="pill" style="cursor:pointer">Learning outcomes (${m.lo.length})</summary><ul style="margin:6px 0 0;padding-left:20px">${m.lo.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>
    <div class="row"><button class="btn pri" data-a="l" data-n="${m.n}">① Learn</button><button class="btn" data-a="c" data-n="${m.n}" ${nc + ng ? "" : "disabled"}>② Cards (${nc + ng})</button><button class="btn" data-a="q" data-n="${m.n}" ${nq ? "" : "disabled"}>③ Quiz (${nq})</button>${pinfo(t, m.n) ? `<button class="btn" data-a="p" data-n="${m.n}">④ Book practice ${ppScore(t, m.n)}</button>` : ""}</div></div>`;
  }).join("");
  $("pane").querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = () => { S.mods[c.dataset.k] = c.checked; save(); });
  $("pane").querySelectorAll("button[data-a]").forEach(b => b.onclick = () => { const n = +b.dataset.n; ({l: paneLearn, c: paneCards, q: paneQuiz, p: panePractice})[b.dataset.a](t, n); window.scrollTo(0, 0); });
}


function paneLearn(t, n){
  const m = mod(t, n), notes = (D.N[t.id] || {})[n] || [];
  const body = notes.map(l => l.startsWith("## ") ? `<h3 style="margin:18px 0 6px;font-size:15px">${esc(l.slice(3))}</h3>`
    : l.startsWith("= ") ? `<div class="mono" style="background:var(--acc2);padding:8px 10px;border-radius:8px;margin:6px 0">${esc(l.slice(2))}</div>`
    : `<p style="margin:6px 0">• ${esc(l)}</p>`).join("");
  const i = t.mods.findIndex(x => x.n === n), nxt = t.mods[i + 1];
  $("pane").innerHTML = `<div class="card"><span class="tag">${src(t, n)}</span><h3 style="margin:4px 0 2px">LM${n} · ${esc(m.t)}</h3>
    <details style="margin:8px 0"><summary class="pill" style="cursor:pointer">Learning outcomes (${m.lo.length})</summary><ul style="margin:6px 0 0;padding-left:20px">${m.lo.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>
    ${body || "<p>No notes yet.</p>"}
    <p class="pill" style="margin-top:16px">Notes are a summary. For depth, read the pages above in your curriculum volume.</p></div>
    <div class="row"><button class="btn" id="bk">← Modules</button><span class="sp"></span><button class="btn pri" id="toC">② Flashcards →</button><button class="btn" id="toQ">③ Quiz →</button></div>
    ${nxt ? `<div class="row"><span class="sp"></span><button class="btn" id="nm">Next module: LM${nxt.n} →</button></div>` : ""}`;
  $("bk").onclick = () => paneMods(t);
  $("toC").onclick = () => { paneCards(t, n); window.scrollTo(0, 0); };
  $("toQ").onclick = () => { paneQuiz(t, n); window.scrollTo(0, 0); };
  if (nxt) $("nm").onclick = () => { paneLearn(t, nxt.n); window.scrollTo(0, 0); };
}


const pinfo = (t, n) => (D.P && D.P[t.id] || {})[n];
function ppScore(t, n){ const P = pinfo(t, n); if (!P) return ""; let done = 0, ok = 0;
  for (let i = 1; i <= P.n; i++) { const v = S.pp[t.id + ":" + n + ":" + i]; if (v) { done++; if (v === "ok" || v === P.a[i - 1]) ok++; } }
  return done ? `(${ok}/${done})` : `(${P.n})`; }
function panePractice(t, n){
  const P = pinfo(t, n), m = mod(t, n);
  const row = i => { const key = t.id + ":" + n + ":" + i, a = P.a[i - 1], v = S.pp[key];
    if (a === "-") return `<div class="mod"><b style="width:34px">${i}.</b><span class="sp pill">Open-ended or no key found. Check the solution, then mark:</span>
      <button class="btn ${v === "ok" ? "pri" : ""}" data-i="${i}" data-v="ok">✓</button><button class="btn ${v === "x" ? "pri" : ""}" data-i="${i}" data-v="x">✗</button></div>`;
    const res = v ? (v === a ? `<span class="ok-t">✓</span>` : `<span class="bad-t">✗ answer ${a}</span>`) : "";
    return `<div class="mod" style="align-items:center"><b style="width:34px">${i}.</b>${"ABC".split("").map(L => `<button class="btn ${v === L ? (L === a ? "pri" : "") : ""}" ${v === L && L !== a ? 'style="border-color:var(--bad);color:var(--bad)"' : ""} data-i="${i}" data-v="${L}">${L}</button>`).join("")}<span class="sp"></span>${res}</div>`; };
  $("pane").innerHTML = `<div class="card"><span class="tag">Book practice · Vol ${t.vol}</span><h3 style="margin:4px 0">LM${n} · ${esc(m.t)}</h3>
    <p style="margin:6px 0">Open <b>Volume ${t.vol}</b> at <b>PDF page ${P.pp}</b> (Practice Problems). Work each problem, then tap your answer. Solutions start at <b>PDF page ${P.sol}</b>.</p>
    <div id="bv" style="margin:10px 0"></div><p class="pill" id="sc"></p>${Array.from({length: P.n}, (_, k) => row(k + 1)).join("")}
    <div class="row"><button class="btn" id="bk">← Modules</button><span class="sp"></span><button class="btn" id="clr">Clear answers</button></div></div>`;
  const score = () => { let done = 0, ok = 0, wrong = []; for (let i = 1; i <= P.n; i++) { const v = S.pp[t.id + ":" + n + ":" + i]; if (v) { done++; if (v === "ok" || v === P.a[i - 1]) ok++; else wrong.push(i); } }
    $("sc").textContent = done ? `Score ${ok}/${done} (${Math.round(100 * ok / done)}%)${wrong.length ? ` · review problems ${wrong.join(", ")} using the solutions` : ""}` : `${P.n} problems`; };
  $("pane").querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { S.pp[t.id + ":" + n + ":" + b.dataset.i] = b.dataset.v; save(); const y = window.scrollY, bv = $("bv"); panePractice._keep = true; panePractice(t, n); panePractice._keep = false; $("bv").replaceWith(bv); window.scrollTo(0, y); });
  $("bk").onclick = () => paneMods(t);
  $("clr").onclick = () => { for (let i = 1; i <= P.n; i++) delete S.pp[t.id + ":" + n + ":" + i]; save(); panePractice(t, n); };
  score();
  if (!panePractice._keep) bookViewer(t, n, P);
}


/* ---------- user's own PDF, rendered locally (never uploaded) ---------- */
const PDFS = {}; let ZOOM = 1;
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function pdfLib(){ if (!window.pdfjsLib) { await loadScript(PDFJS + "pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; } return window.pdfjsLib; }
function idb(){ return new Promise((ok, no) => { try { const r = indexedDB.open("cfa-pdfs", 1); r.onupgradeneeded = () => r.result.createObjectStore("v"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise(ok => { const q = db.transaction("v").objectStore("v").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } }
async function idbPut(k, v){ try { const db = await idb(); db.transaction("v", "readwrite").objectStore("v").put(v, k); } catch (e) {} }
async function getPdf(vol){ if (PDFS[vol]) return PDFS[vol]; const buf = await idbGet("vol" + vol); if (!buf) return null; const lib = await pdfLib(); PDFS[vol] = await lib.getDocument({data: buf.slice(0)}).promise; return PDFS[vol]; }
async function renderPages(el, doc, from, to){
  el.innerHTML = "";
  const w = Math.min(el.clientWidth || 360, 900) * ZOOM;
  for (let i = from; i <= Math.min(to, doc.numPages); i++) {
    const page = await doc.getPage(i), v1 = page.getViewport({scale: 1}), scale = (w / v1.width) * (window.devicePixelRatio || 1);
    const vp = page.getViewport({scale}), c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height; c.style.width = (100 * ZOOM) + "%"; c.style.border = "1px solid var(--line)"; c.style.borderRadius = "6px"; c.style.marginBottom = "8px"; c.style.background = "#fff";
    el.appendChild(c); await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
  }
}
async function bookViewer(t, n, P){
  const box = $("bv"); if (!box) return;
  const doc = await getPdf(t.vol);
  if (!doc) {
    box.innerHTML = `<div class="exp">Show the problems here: pick your <b>Volume ${t.vol}</b> PDF once. It stays on this device only, nothing is uploaded.<div class="row"><input type="file" accept="application/pdf" id="pf"></div></div>`;
    $("pf").onchange = async e => { const f = e.target.files[0]; if (!f) return; box.innerHTML = `<p class="pill">Loading PDF…</p>`;
      try { const buf = await f.arrayBuffer(); await idbPut("vol" + t.vol, buf); const lib = await pdfLib(); PDFS[t.vol] = await lib.getDocument({data: buf.slice(0)}).promise; bookViewer(t, n, P); }
      catch (err) { box.innerHTML = `<p class="bad-t">Could not open that PDF.</p>`; } };
    return;
  }
  let mode = "q";
  const draw = async () => {
    box.innerHTML = `<div class="row" style="margin:0 0 8px"><button class="btn ${mode === "q" ? "pri" : ""}" id="vq">Problems</button><button class="btn ${mode === "s" ? "pri" : ""}" id="vs">Solutions</button><button class="btn" id="vz">Zoom ${ZOOM > 1 ? "−" : "+"}</button><span class="sp"></span><button class="btn" id="vx">Change PDF</button></div><div id="vp" style="max-height:65vh;overflow:auto;border-radius:8px"><p class="pill">Rendering…</p></div>`;
    $("vz").onclick = () => { ZOOM = ZOOM > 1 ? 1 : 1.8; draw(); }; $("vq").onclick = () => { mode = "q"; draw(); }; $("vs").onclick = () => { mode = "s"; draw(); };
    $("vx").onclick = async () => { delete PDFS[t.vol]; await idbPut("vol" + t.vol, null); bookViewer(t, n, P); };
    const span = Math.max(1, P.sol - P.pp);
    try { mode === "q" ? await renderPages($("vp"), doc, P.pp, P.sol) : await renderPages($("vp"), doc, P.sol, P.sol + Math.min(span + 1, 8)); }
    catch (e) { $("vp").innerHTML = `<p class="bad-t">Could not render pages. Is this the 2026 Volume ${t.vol} PDF?</p>`; }
  };
  draw();
}

/* ---------- flashcards ---------- */
function paneCards(t, n){
  let deck = cs(t).filter(x => n == null || x.c[0] === n).map(x => ({key: "c:" + x.key, f: x.c[1], b: x.c[2], n: x.c[0]}));
  const withG = !PUBLIC && (n != null || S.inclG);
  if (withG) deck = deck.concat(gl(t, n).map(g => ({key: "g:" + g[0], f: g[0], b: g[1], n: g[3], gl: true})));
  deck = shuffle(deck).sort((a, b) => (S.cards[a.key] || 0) - (S.cards[b.key] || 0));
  let k = 0, flipped = false; const p = $("pane");
  if (!deck.length) { p.innerHTML = `<div class="card">No cards here.</div>`; return; }
  function draw(){
    const c = deck[k], sc = S.cards[c.key] || 0;
    p.innerHTML = `<div class="row" style="margin:0 0 8px"><span class="pill">${n != null ? `LM${n} · ` : ""}Card ${k + 1}/${deck.length} · box ${sc}/3</span><span class="sp"></span>
      ${!PUBLIC && n == null ? `<label class="pill"><input type="checkbox" id="ig" ${S.inclG ? "checked" : ""}> include glossary terms</label>` : ""}</div>
    <div class="card flash ${flipped ? "back" : ""}" id="fc">${esc(flipped ? c.b : c.f)}</div>
    <div class="pill" style="margin-top:6px">${c.gl ? "Glossary · " : ""}${src(t, c.n)}</div>
    <div class="row"><button class="btn" id="pv" ${k === 0 ? "disabled" : ""}>← Prev</button><span class="sp"></span>
    ${flipped ? `<button class="btn" id="ag">Again</button><button class="btn pri" id="gd">Got it</button>` : `<button class="btn pri" id="fl">Show answer</button>`}
    <span class="sp"></span><button class="btn" id="nx">Next →</button></div>`;
    $("fc").onclick = flip; if ($("fl")) $("fl").onclick = flip;
    if ($("ig")) $("ig").onchange = e => { S.inclG = e.target.checked; save(); paneCards(t, n); };
    $("pv").onclick = () => { k--; flipped = false; draw(); };
    $("nx").onclick = next;
    if ($("ag")) $("ag").onclick = () => { S.cards[c.key] = 0; save(); deck.push(c); next(); };
    if ($("gd")) $("gd").onclick = () => { S.cards[c.key] = Math.min(3, sc + 1); save(); next(); };
  }
  function flip(){ flipped = !flipped; draw(); }
  function next(){ if (k < deck.length - 1) { k++; flipped = false; draw(); } else { p.innerHTML = `<div class="card"><b>Deck done.</b><div class="row"><button class="btn" id="again">Go again</button>${n != null ? `<button class="btn pri" id="toQ">③ Quiz →</button>` : ""}</div></div>`; $("again").onclick = () => paneCards(t, n); if ($("toQ")) $("toQ").onclick = () => paneQuiz(t, n); } }
  document.onkeydown = e => { if (!$("fc")) return; if (e.code === "Space") { e.preventDefault(); flip(); } if (e.key === "ArrowRight") next(); };
  draw();
}

/* ---------- quiz engine ---------- */
function runQuiz(el, items, onDone, timed){
  let k = 0, score = 0, res = [], start = Date.now(), timer = null;
  function draw(){
    const it = items[k]; const q = it.q; const opts = shuffle(q[2].map((o, j) => ({o, j})));
    el.innerHTML = `<div class="row" style="margin:0 0 8px"><span class="pill">Question ${k + 1}/${items.length}</span><span class="sp"></span><span class="pill" id="tm"></span><span class="pill">Score ${score}/${k}</span></div>
    <div class="card"><span class="tag">${esc(it.t.name)} · ${src(it.t, q[0])}</span><div class="q">${esc(q[1])}</div>
    <div>${opts.map((x, i) => `<button class="opt" data-j="${x.j}">${"ABC"[i]}. ${esc(x.o)}</button>`).join("")}</div><div id="ex"></div></div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.j));
  }
  function answer(j){
    const it = items[k], ok = j === it.q[3]; if (ok) score++;
    res.push({t: it.t.id, ok});
    const r = S.quiz[it.key] || {n:0, c:0}; r.n++; if (ok) r.c++; r.last = ok; S.quiz[it.key] = r;
    S.wrong = S.wrong.filter(w => w !== it.key); if (!ok) S.wrong.push(it.key); save();
    el.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bj = +b.dataset.j; if (bj === it.q[3]) b.classList.add("ok"); else if (bj === j) b.classList.add("bad"); });
    $("ex").innerHTML = `<div class="exp"><b class="${ok ? "ok-t" : "bad-t"}">${ok ? "Correct." : "Incorrect."}</b> ${esc(it.q[4])}</div>
    <div class="row"><span class="sp"></span><button class="btn pri" id="nq">${k < items.length - 1 ? "Next →" : "Finish"}</button></div>`;
    $("nq").onclick = () => { k++; k < items.length ? draw() : finish(); };
  }
  function finish(){ if (timer) clearInterval(timer); onDone(score, items.length, res, Math.round((Date.now() - start) / 1000)); }
  if (timed) timer = setInterval(() => { const e = $("tm"); if (!e) { clearInterval(timer); return; } const s = Math.round((Date.now() - start) / 1000), lim = items.length * 90; e.textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} / ${Math.round(lim / 60)}:00`; if (s > lim) e.classList.add("bad-t"); }, 1000);
  draw();
}

function paneQuiz(t, n){
  const items = shuffle(qs(t).filter(x => n == null || x.q[0] === n));
  runQuiz($("pane"), items, (s, tot, res) => {
    $("pane").innerHTML = `<div class="card"><div class="big">${s}/${tot}</div><p class="sub">${Math.round(100 * s / tot)}%${n != null ? ` on LM${n}` : ""}</p><div class="row"><button class="btn pri" id="rt">Retake</button>${n != null ? `<button class="btn" id="bm">← Modules</button>` : ""}${n != null && pinfo(t, n) ? `<button class="btn pri" id="bp">④ Book practice →</button>` : ""}<button class="btn" onclick="go('review')">Review mistakes</button></div></div>`;
    $("rt").onclick = () => paneQuiz(t, n); if ($("bm")) $("bm").onclick = () => paneMods(t); if ($("bp")) $("bp").onclick = () => panePractice(t, n);
  });
}

function paneForm(t){
  const rows = F.filter(f => f[0] === FMAP[t.id]);
  $("pane").innerHTML = rows.length ? `<div class="card"><table>${rows.map(r => `<tr><td><b>${esc(r[1])}</b></td><td class="mono">${esc(r[2])}</td></tr>`).join("")}</table></div>` : `<div class="card">No formulas for this topic.</div>`;
}

function mock(){
  app.innerHTML = `<h2>Mock exam</h2><p class="sub">Questions drawn across topics in proportion to CFA exam weights. 90 seconds per question.</p>
  <div class="card" id="setup"><div class="row" style="margin:0">Questions: <select id="nq"><option>30</option><option selected>60</option><option>90</option><option>180</option></select><span class="sp"></span><button class="btn pri" id="st">Start</button></div></div><div id="mk" style="margin-top:14px"></div>`;
  $("st").onclick = () => {
    const n = +$("nq").value, tot = Object.values(W).reduce((a, b) => a + b, 0);
    let pool = []; D.topics.forEach(t => { pool = pool.concat(shuffle(qs(t)).slice(0, Math.max(1, Math.round(n * W[t.id] / tot)))); });
    pool = shuffle(pool).slice(0, n); $("setup").style.display = "none";
    runQuiz($("mk"), pool, (s, tot, res, sec) => {
      const by = {}; res.forEach(r => { by[r.t] = by[r.t] || {c:0, n:0}; by[r.t].n++; if (r.ok) by[r.t].c++; });
      $("mk").innerHTML = `<div class="card"><div class="big">${s}/${tot} · ${Math.round(100 * s / tot)}%</div><p class="sub">Time ${Math.floor(sec / 60)}m ${sec % 60}s (limit ${Math.round(tot * 1.5)}m)</p>
      <table><tr><th>Topic</th><th>Score</th><th></th></tr>${D.topics.filter(t => by[t.id]).map(t => { const b = by[t.id], p = Math.round(100 * b.c / b.n); return `<tr><td>${esc(t.name)}</td><td>${b.c}/${b.n}</td><td class="${p >= 70 ? "ok-t" : "bad-t"}">${p}%</td></tr>`; }).join("")}</table>
      <div class="row"><button class="btn pri" onclick="go('mock')">New mock</button><button class="btn" onclick="go('review')">Review mistakes</button></div></div>`;
    }, true);
  };
}

function formulas(){
  app.innerHTML = `<h2>Formula sheet</h2><p class="sub">${F.length} formulas.</p><input type="search" id="fs" placeholder="e.g. duration, WACC, PM"><div class="card"><table id="ft"></table></div>`;
  const draw = q => { q = q.toLowerCase(); $("ft").innerHTML = `<tr><th>Topic</th><th>Name</th><th>Formula</th></tr>` + F.filter(f => f.join(" ").toLowerCase().includes(q)).map(f => `<tr><td class="pill">${f[0]}</td><td><b>${esc(f[1])}</b></td><td class="mono">${esc(f[2])}</td></tr>`).join(""); };
  $("fs").oninput = e => draw(e.target.value); draw("");
}

function ppWrong(){ const out = []; D.topics.forEach(t => Object.keys((D.P || {})[t.id] || {}).forEach(n => { const P = D.P[t.id][n], w = []; for (let i = 1; i <= P.n; i++) { const v = S.pp[t.id + ":" + n + ":" + i]; if (v && v !== "ok" && v !== P.a[i - 1]) w.push(i); } if (w.length) out.push(`<tr><td>${esc(t.name)} LM${n}</td><td>Vol ${t.vol}, solutions from PDF p. ${P.sol}</td><td>#${w.join(", #")}</td></tr>`); })); return out.length ? `<h3 style="margin-top:24px">Book practice to review</h3><div class="card"><table>${out.join("")}</table></div>` : ""; }
function review(){
  const items = S.wrong.map(k => { const [id, i] = k.split(":"); const t = topic(id); return t && D.Q[id] && D.Q[id][+i] ? {t, q: D.Q[id][+i], i: +i, key: k} : null; }).filter(Boolean);
  if (!items.length) { app.innerHTML = `<h2>Mistakes</h2><div class="card">No open app-quiz mistakes.</div>` + ppWrong(); return; }
  app.innerHTML = `<h2>Mistakes</h2><p class="sub">${items.length} question(s) to redo.</p><div id="rv"></div>` + ppWrong();
  runQuiz($("rv"), shuffle(items), (s, n) => { $("rv").innerHTML = `<div class="card"><div class="big">${s}/${n}</div><p class="sub">${S.wrong.length} remaining.</p><div class="row"><button class="btn pri" onclick="go('review')">Continue</button></div></div>`; });
}

function glossary(){
  app.innerHTML = `<h2>Glossary</h2><p class="sub">${G.length} terms from the 2026 CFA Level I Glossary, tagged to the module where each term is used most.</p>
  <input type="search" id="gi" placeholder="Search terms or definitions"><div class="card"><table id="gt"></table><p class="pill" id="gn"></p></div>`;
  const draw = q => { q = q.toLowerCase().trim(); let r = q ? G.filter(x => x[0].toLowerCase().includes(q)) : G; if (q && r.length < 20) r = r.concat(G.filter(x => !x[0].toLowerCase().includes(q) && x[1].toLowerCase().includes(q)));
    $("gt").innerHTML = r.slice(0, 150).map(x => { const t = x[2] && topic(x[2]); return `<tr><td style="width:30%"><b>${esc(x[0])}</b>${t ? `<br><span class="pill">${esc(t.name)} · LM${x[3]}</span>` : ""}</td><td>${esc(x[1])}</td></tr>`; }).join("");
    $("gn").textContent = r.length > 150 ? `Showing 150 of ${r.length}.` : `${r.length} result(s)`; };
  $("gi").oninput = e => draw(e.target.value); draw("");
}

/* ---------- boot ---------- */
(async () => {
  try { D = await (await fetch("content.json")).json(); } catch (e) { app.innerHTML = `<div class="card">Could not load content.</div>`; return; }
  if (!PUBLIC) { try { G = await (await fetch("glossary.json")).json(); } catch (e) { G = []; } }
  if (PUBLIC || !G.length) { const b = document.querySelector('#nav [data-v="glossary"]'); if (b) b.remove(); }
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
  go("home");
})();
